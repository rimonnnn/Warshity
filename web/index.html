<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBFAF4">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="861319834330-i1nejoiep8dkfrmu4ptl3qcd1kejadj6.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="warshity">
  <link rel="apple-touch-icon" href="splash/latest_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="splash/latest_logo.png"/>

  <title>Masiter</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pre-loader -->
  <link rel="preload" as="image" href="splash/latest_logo.png">
  <style>
    html, body { margin: 0; background: #FBFAF4; }

    #preloader {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      background: #FBFAF4;
      opacity: 1; transition: opacity .3s ease;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    #preloader.hide { opacity: 0; pointer-events: none; }

    #preloader .col {
      display: flex; flex-direction: column; align-items: center;
      animation: pl-fade .9s ease-out both;
    }

    .pl-logo-wrap { position: relative; width: 150px; height: 150px;
      display: flex; align-items: center; justify-content: center; }

    .pl-ring {
      position: absolute; inset: 2px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(26,166,183,0) 0deg, #1AA6B7 252deg, #2E9E5B 270deg,
        rgba(0,0,0,0) 270deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: pl-spin 2s linear infinite;
    }

    .pl-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      animation: pl-pulse 1.4s ease-in-out infinite alternate; }

    .pl-title { margin: 28px 0 0; font-size: 30px; font-weight: 700; color: #0E5C73; line-height: 1.2; }
    .pl-tag   { margin: 6px 0 0;  font-size: 14px; color: #757575; }

    .pl-bar { margin-top: 32px; width: 220px; height: 4px; border-radius: 8px;
      background: #E0E0E0; overflow: hidden; position: relative; }
    .pl-bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
      background: #1AA6B7; border-radius: 8px; animation: pl-slide 1.4s ease-in-out infinite; }

    .pl-msg { margin-top: 12px; font-size: 12px; color: #757575; }

    @keyframes pl-spin  { to { transform: rotate(360deg); } }
    @keyframes pl-pulse { from { transform: scale(.95); } to { transform: scale(1.05); } }
    @keyframes pl-fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pl-slide { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <!-- Pre-loader: لازم يكون أول عنصر في الـ body -->
  <div id="preloader" dir="rtl" role="status" aria-label="Loading">
    <div class="col">
      <div class="pl-logo-wrap">
        <div class="pl-ring"></div>
        <img class="pl-logo" src="splash/latest_logo.png" alt="Logo">
      </div>
      <h1 class="pl-title">مسيطر</h1>
      <p class="pl-tag">شغلك تحت السيطرة</p>
      <div class="pl-bar"></div>
      <div class="pl-msg">جاري الاتصال بالخادم...</div>
    </div>
  </div>

 <script>
  (function () {
    var done = false;
    // Flutter بينده الدالة دي بعد ما أول شاشة تترسم فعلاً
    window.hideAppPreloader = function () {
      if (done) return;
      done = true;
      var el = document.getElementById('preloader');
      if (!el) return;
      el.classList.add('hide');
      el.addEventListener('transitionend', function () { el.remove(); }, { once: true });
      setTimeout(function () { el.remove(); }, 600); // احتياط لو transitionend ماجاش
    };
  })();
</script>

  <script src="flutter_bootstrap.js" async></script>

    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '3471398589689215',
        cookie: true,
        xfbml: true,
        version: 'v23.0'
      });
    };
  </script>
</body>
</html>
